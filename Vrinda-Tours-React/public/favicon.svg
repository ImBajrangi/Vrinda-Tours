<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Outer Location Marker Pin Outline -->
  <path d="M50 18 C33.4 18 20 31.4 20 48 C20 68 50 86 50 86 C50 86 80 68 80 48 C80 31.4 66.6 18 50 18 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sacred Center Orb -->
  <circle cx="50" cy="46" r="16" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <circle cx="50" cy="46" r="8" fill="#FFFFFF" />
  <circle cx="50" cy="46" r="4" fill="#0F172A" />
</svg>
